const ALL=GROUPS.flatMap(g=>g.tabs);
const $=id=>document.getElementById(id);
(async () => {
const response = await fetch('./data.json', {cache: 'no-store'});
if (!response.ok) throw new Error('Data request failed: ' + response.status);
const DATA = await response.json();
if (!Array.isArray(DATA.metrics) || !DATA.metrics.length) throw new Error('Invalid dashboard data');

const REGIMES =
  DATA.regimes &&
  Array.isArray(DATA.regimes.us) &&
  Array.isArray(DATA.regimes.jp) &&
  Array.isArray(DATA.regimes.kr)
    ? DATA.regimes
    : {us: [], jp: [], kr: []};

let showRegimes = false;

try {
  showRegimes = localStorage.getItem('macroShowRegimes') === 'true';
} catch (error) {
  console.warn('Regime preference could not be loaded.', error);
}

let group=null,section=GROUPS[0].tabs[0].key,selected=null,years=5,focusTab=false,zoomRange=null;

// -- Compare ("지표 비교") state: any two metrics across countries --
const metricGroupLabel = {};
GROUPS.forEach(g=>g.tabs.forEach(t=>t.ids.forEach(id=>{ if(!metricGroupLabel[id]) metricGroupLabel[id]=g.label+' · '+t.label; })));
const compareMetrics = DATA.metrics;
let compareA = DATA.metrics.some(m=>m.id==='unemployment') ? 'unemployment' : DATA.metrics[0]?.id;
let compareB = DATA.metrics.some(m=>m.id==='cpi_headline') ? 'cpi_headline' : DATA.metrics[1]?.id;
let compareYears = 5;
let compareZoomRange = null;

const regimeAvailable = () => ['us', 'jp', 'kr'].includes(group);
const activeRegimes = () =>
  group && Array.isArray(REGIMES[group]) ? REGIMES[group] : [];

const regimeAt = day => {
  const interval = activeRegimes().find(
    ([start, end]) => day >= start && day < end
  );

  return interval ? interval[2] : 'unavailable';
};
const regimeLegendHTML = () =>
  Object.entries(REGIME_STYLES).map(([key, style]) => {
  const swatch = key === 'unavailable'
  ? '<i class="regime-swatch unavailable"></i>'
  : `<i class="regime-swatch" style="background:${style.fill};border-color:${style.border}"></i>`;

return `<span>${swatch}${style.label}</span>`;
  }).join('');

const saveRegimePreference = value => {
  try {
    localStorage.setItem('macroShowRegimes', String(value));
  } catch (error) {
    console.warn('Regime preference could not be saved.', error);
  }
};
const groupOf=k=>GROUPS.find(g=>g.key===k);
const tabOf=k=>ALL.find(t=>t.key===k);
const expired=m=>m.sources.some(s=>s.age!=null&&s.age>Math.max(2*(s.maxAge||0),120));
const allFor=k=>tabOf(k).ids.map(id=>DATA.metrics.find(m=>m.id===id)).filter(Boolean);
const listFor=k=>allFor(k).filter(m=>!expired(m));
const hiddenFor=k=>allFor(k).filter(expired);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=2)=>v==null?'—':new Intl.NumberFormat('ko-KR',{maximumFractionDigits:d,minimumFractionDigits:d}).format(v);
const fmt=m=>m.text||num(m.value,['천 명','천 건','십억 달러','bp'].includes(m.unit)?1:2);
const deltaUnit=m=>m.unit==='%'?'%p':m.unit;
const changeText=m=>m.delta==null?'비교 자료 부족':`${m.delta>0?'+':''}${num(m.delta,2)} ${deltaUnit(m)}`;
const dateText=m=>m.sources.every(s=>s.frequency==='monthly')?m.date?.slice(0,7):m.date;
const metricValue=id=>DATA.metrics.find(m=>m.id===id)?.value;
function directional(id){const m=DATA.metrics.find(m=>m.id===id);if(!m||m.delta==null)return `${m?.title||id}: 비교 자료 부족`;return `${m.title} ${changeText(m)} (${m.period})${m.status==='stale'?' · 자료 지연':''}`;}
function reading(){const t=tabOf(section),list=listFor(section),have=id=>list.some(m=>m.id===id);if(!list.length)return hiddenFor(section).length?'표시할 최신 자료가 없습니다.':'이 탭의 지표는 아직 수집 준비 중입니다.';let ids=(t.read||t.ids).filter(have).slice(0,3);if(!ids.length)ids=list.slice(0,3).map(m=>m.id);return ids.map(directional).join(' · ');}
function buildTabs(){
 $('tabs').innerHTML=groupOf(group).tabs.map((t,i)=>`<button role="tab" id="tab-${t.key}" data-section="${t.key}" aria-selected="${t.key===section}" aria-controls="content" tabindex="${t.key===section?0:-1}">${String(i+1).padStart(2,'0')} ${t.label}</button>`).join('');
 const items=[...document.querySelectorAll('#tabs [data-section]')];
 items.forEach((b,i)=>{b.onclick=()=>{location.hash=group+'/'+b.dataset.section};b.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();focusTab=true;items[(i+(e.key==='ArrowRight'?1:items.length-1))%items.length].click();}}});

function pearson(pairs){
 const n=pairs.length; if(n<3) return null;
 const xs=pairs.map(p=>p[0]), ys=pairs.map(p=>p[1]);
 const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
 const mx=mean(xs), my=mean(ys);
 let numer=0,dx=0,dy=0;
 for(let i=0;i<n;i++){numer+=(xs[i]-mx)*(ys[i]-my);dx+=(xs[i]-mx)**2;dy+=(ys[i]-my)**2;}
 return (dx&&dy)?numer/Math.sqrt(dx*dy):null;
}

function drawCompare(){

 const start=compareZoomRange?domainStart:Math.min(ts(normA[0][0]), ts(normB[0][0]));

 for(let i=0;i<5;i++){const v=i*25,yy=y(v);svg+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#e2e9ee"/><text x="${L-8}" y="${yy+4}" text-anchor="end" fill="#5e7080" font-size="12">${v}</text>`;}
 for(let i=0;i<5;i++){const d=new Date(start+span*i/4).toISOString().slice(0,10);svg+=`<text x="${L+(W-L-R)*i/4}" y="${H-12}" text-anchor="${i===0?'start':i===4?'end':'middle'}" fill="#5e7080" font-size="12">${d.slice(0,7)}</text>`;}

const regimeLabel = pointRegime

                          tip.style.display='block';const wr=$('chart-wrap').getBoundingClientRect();let left=e.clientX-wr.left+14;if(left+tip.offsetWidth>wr.width)left=e.clientX-wr.left-tip.offsetWidth-14;tip.style.left=left+'px';tip.style.top=Math.max(0,e.clientY-wr.top-tip.offsetHeight-12)+'px';};
