<style>

k);border-left:4px solid transparent}.metric:last-child{border-bottom:0}.metric[aria-pressed=true]{background:#e9f3f3;border-left-color:var(--accent)}.metric:hover{background:#eff5f7}.metric .name{display:block;font-size:14px;font-weight:700}.metric .value{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;display:block;margin-top:3px}.metric .unit{font-size:13px;font-weight:400;margin-left:5px;color:var(--muted)}.metric .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}.panel{background:white;border:1px solid var(--line);padding:25px 28px}.panel-top{display:flex;justify-content:space-between;align-items:start;gap:20px}.panel h3{font-size:20px;margin:0}.latest{font-size:34px;line-height:1.4;font-weight:700;letter-spacing:-1px}.latest small{font-size:15px;margin-left:6px;color:var(--muted);font-weight:400;letter-spacing:0}.delta{color:var(--muted);font-size:14px;margin-top:3px}.periods{display:flex;gap:3px;flex-wrap:wrap;justify-content:end}.periods button{background:none;border:1px solid transparent;padding:5px 9px;font-size:13px;color:var(--muted)}.periods button.active{background:var(--navy);color:white}.chart-wrap{position:relative;margin-top:18px}.chart{width:100%;height:auto;display:block;overflow:visible}.hover{height:25px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}.legend{display:flex;gap:20px;font-size:13px;color:var(--muted);margin:8px 0;flex-wrap:wrap}.key{display:inline-block;width:18px;height:3px;margin-right:7px;vertical-align:middle;background:var(--accent)}.key.alt{background:#a36c22}.chart-range{font-size:12px;color:var(--muted);text-align:right}.note{border-top:1px solid var(--line);margin-top:16px;padding-top:15px;color:var(--muted);font-size:14px}.quality{margin-top:18px;color:var(--warn);font-size:14px}.sources{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}summary{cursor:pointer;font-weight:700;font-size:14px}.formula{font-size:14px;padding:10px 0;color:var(--muted)}.source{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line);font-size:13px}.source a{color:var(--accent);font-weight:700}.source span{display:block;color:var(--muted)}.method{margin-top:28px;font-size:13px;color:var(--muted);max-width:1060px}.foot{border-top:1px solid var(--line);margin-top:22px;padding-top:16px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:20px}noscript{display:block;padding:30px}.empty{padding:80px 20px;text-align:center;color:var(--muted)}@media(max-width:1000px){.workspace{grid-template-columns:245px 1fr}.panel{padding:20px}.panel-top{flex-direction:column}.periods{justify-content:start}}@media(max-width:720px){.head{padding:18px 20px;align-items:start}.stamp{max-width:140px;font-size:12px}.wrap{padding:0 18px 24px}.tabs{gap:20px}.tabs button{font-size:14px}.intro{display:block}.intro .badge{display:inline-block;margin-top:12px}.reading{display:block;padding:18px}.reading p{margin-top:6px;font-size:14px}.workspace{grid-template-columns:1fr}.metric-list{display:grid;grid-template-columns:1fr 1fr}.metric{padding:12px;border-bottom:1px solid var(--line)}.metric .value{font-size:22px}.metric .meta{display:block}.metric .meta span{display:block}.metric:last-child{grid-column:1/-1}.source{grid-template-columns:1fr}.latest{font-size:30px}.foot{display:block}.panel{padding:18px}.chart-wrap{margin-top:8px}.chart-range{text-align:left}}.tip{position:absolute;display:none;pointer-events:none;z-index:5;background:var(--navy);color:white;padding:8px 12px;font-size:14px;line-height:1.5;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 2px 8px rgba(0,0,0,.2)}.tip b{display:block;font-size:12px;font-weight:400;color:#72d1ce}.wrap{max-width:1440px;margin:auto;padding:0 36px 36px}.tabs{gap:22px;overflow-x:auto;white-space:nowrap}.tabs button{flex:none}
</style></head><body>
<header><div class="head"><div><div class="eyebrow">Macro data</div><h1>매크로 데이터</h1></div><div class="stamp" id="stamp"></div></div></header> 
<main class="wrap"><div id="home"></div><div id="crumb" style="display:none"></div><nav class="tabs" id="tabs" role="tablist" aria-label="매크로 화면" style="display:none"></nav>
<section id="content" role="tabpanel" style="display:none"><div class="intro"><div><h2 id="section-title"></h2><p id="section-description"></p></div><span class="badge" id="coverage" style="display:none"></span></div><div class="reading"><strong>최근 변화</strong><p id="reading"></p></div><div class="workspace"><div class="metric-list" id="metrics" aria-label="지표 선택"></div><article class="panel" id="panel"></article></div></section>
<div class="method"><strong>읽는 기준</strong><br>점수 하나로 시장을 판정하지 않습니다. 수준과 최근 변화, 서로 다른 지표의 방향을 함께 확인하세요. <span id="method"></span> 자료가 오래되거나 없으면 이전 값을 현재 값으로 바꾸지 않고 상태를 표시합니다.</div><footer class="foot"><span>원자료 → 계산 → 표시를 분리한 매크로 관측 도구</span><span>하루 2회(한국시간 08:17·20:17) 자동 수집 · 실제 관측일과 자료 상태를 확인하세요.</span></footer></main><noscript>이 대시보드에는 JavaScript가 필요합니다.</noscript>
<script>
'use strict';
const GROUPS=[
{key:'us',label:'미국 매크로',tabs:[
{key:'jobs',label:'고용·실업',title:'고용과 실업',desc:'노동시장의 강도와 변화를 확인합니다.',ids:['unemployment','jobs','claims']},
{key:'prices',label:'물가',title:'물가 상승 속도',desc:'소비자·생산자 물가를 헤드라인과 근원으로 나누어 읽습니다.',ids:['cpi_headline','cpi','pce_headline','pce','ppi_core'],read:['cpi_headline','pce_headline','ppi_core']},
{key:'growth',label:'경기',title:'소비와 주문',desc:'소매판매와 내구재 수주로 수요의 방향을 확인합니다.',ids:['retail','durable']},
{key:'liquidity',label:'유동성',title:'유동성',desc:'재무부 계좌·지준금·연준 순유동성으로 자금의 양을 확인합니다.',ids:['tga','reserves','netliq','m2'],read:['tga','reserves','netliq']},
{key:'stability',label:'금융 안정',title:'금융 안정',desc:'단기 자금시장의 긴장, 신용 스프레드, 금융 스트레스를 확인합니다.',ids:['repo','credit','nfci','stlfsi'],read:['repo','credit','nfci']},
{key:'rates',label:'미국채',title:'미국채와 정책금리',desc:'국채 금리 수준, 장단기 금리차, 실질금리, 정책금리를 확인합니다.',ids:['ust2','ust10','curve','real','fedtarget'],read:['ust2','ust10','curve']},
{key:'market',label:'시장',title:'주식시장',desc:'S&P 500의 추세와 변동성을 확인합니다.',ids:['trend','vix']},
{key:'fx',label:'환율',title:'환율',desc:'원·달러, 엔·달러, 달러인덱스의 흐름을 확인합니다.',ids:['usdkrw','usdjpy','dxy']},
{key:'commodities',label:'원자재',title:'원자재',desc:'귀금속, 구리, 원유 선물 가격의 흐름을 확인합니다.',ids:['gold','silver','copper','wti','brent'],read:['gold','copper','wti']}
]},
{key:'jp',label:'일본 매크로',tabs:[
{key:'jp_prices',label:'물가',title:'일본 물가',desc:'전국·도쿄 CPI와 기업물가(CGPI)로 물가 압력을 확인합니다.',ids:['jp_cpi_all','jp_cpi_exfresh','jp_cpi_svc','tokyo_cpi_all','tokyo_cpi_exfresh','jp_cgpi'],read:['jp_cpi_exfresh','jp_cpi_svc','jp_cgpi']},
{key:'jp_wages',label:'임금',title:'임금',desc:'춘투 인상률과 월간 임금 지표로 임금과 물가의 선순환을 확인합니다.',ids:['shunto','jp_wage_sched','jp_real_wage']},
{key:'jp_rates',label:'금리',title:'정책금리와 국채 금리',desc:'일본은행 정책금리, 일본 국채 금리, 일본 장단기 금리차와 미·일 금리차를 확인합니다.',ids:['boj_rate','jgb2','jgb10','jp_curve','us_jp_2y','us_jp_10y'],read:['boj_rate','jgb10','us_jp_10y']},
{key:'jp_business',label:'기업 경기·투자',title:'단칸 기업 경기와 설비투자',desc:'대기업 업황·전망 DI와 설비투자 계획을 확인합니다.',ids:['tankan_mfg_now','tankan_mfg_fcst','tankan_nonmfg_now','tankan_nonmfg_fcst','tankan_capex'],read:['tankan_mfg_now','tankan_nonmfg_now','tankan_capex']},
{key:'jp_activity',label:'생산·소비',title:'생산과 소비',desc:'광공업 생산·재고와 소매판매, 가계소비를 확인합니다.',ids:['jp_ip','jp_inventory','jp_retail','jp_hh_consumption']},
{key:'jp_yen',label:'엔 포지션',title:'엔화와 투기 포지션',desc:'USD/JPY와 CFTC 엔화 순포지션(Legacy·TFF, 서로 다른 분류)을 확인합니다.',ids:['usdjpy','cftc_legacy','cftc_tff']}
]}
];
const ALL=GROUPS.flatMap(g=>g.tabs);
const DESC={us:'고용·물가·경기·유동성·금융 안정·미국채·시장·환율·원자재',jp:'물가·임금·금리·단칸 기업 경기·생산·엔 포지션'};
const $=id=>document.getElementById(id);
(async () => {
const response = await fetch('./data.json', {cache: 'no-store'});
if (!response.ok) throw new Error('Data request failed: ' + response.status);
const DATA = await response.json();
if (!Array.isArray(DATA.metrics) || !DATA.metrics.length) throw new Error('Invalid dashboard data');
let group=null,section=GROUPS[0].tabs[0].key,selected=null,years=5,focusTab=false;
const groupOf=k=>GROUPS.find(g=>g.key===k);
const tabOf=k=>ALL.find(t=>t.key===k);
const expired=m=>m.sources.some(s=>s.age!=null&&s.age>Math.max(2*(s.maxAge||0),120));
const allFor=k=>tabOf(k).ids.map(id=>DATA.metrics.find(m=>m.id===id)).filter(Boolean);
const listFor=k=>allFor(k).filter(m=>!expired(m));
const hiddenFor=k=>allFor(k).filter(expired);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=2)=>v==null?'—':new Intl.NumberFormat('ko-KR',{maximumFractionDigits:d,minimumFractionDigits:d}).format(v);
const fmt=m=>m.text||num(m.value,['천 명','천 건','십억 달러','bp'].includes(m.unit)?1:2);
const deltaUnit=m=>m.unit==='%'?'%p':m.unit;
const changeText=m=>m.delta==null?'비교 자료 부족':`${m.delta>0?'+':''}${num(m.delta,2)} ${deltaUnit(m)}`;
const dateText=m=>m.sources.every(s=>s.frequency==='monthly')?m.date?.slice(0,7):m.date;
function directional(id){const m=DATA.metrics.find(m=>m.id===id);if(!m||m.delta==null)return `${m?.title||id}: 비교 자료 부족`;return `${m.title} ${changeText(m)} (${m.period})${m.status==='stale'?' · 자료 지연':''}`;}
function reading(){const t=tabOf(section),list=listFor(section),have=id=>list.some(m=>m.id===id);if(!list.length)return hiddenFor(section).length?'표시할 최신 자료가 없습니다.':'이 탭의 지표는 아직 수집 준비 중입니다.';let ids=(t.read||t.ids).filter(have).slice(0,3);if(!ids.length)ids=list.slice(0,3).map(m=>m.id);return ids.map(directional).join(' · ');}
function buildTabs(){
 $('tabs').innerHTML=groupOf(group).tabs.map((t,i)=>`<button role="tab" id="tab-${t.key}" data-section="${t.key}" aria-selected="${t.key===section}" aria-controls="content" tabindex="${t.key===section?0:-1}">${String(i+1).padStart(2,'0')} ${t.label}</button>`).join('');
 const items=[...document.querySelectorAll('#tabs [data-section]')];
 items.forEach((b,i)=>{b.onclick=()=>{location.hash=group+'/'+b.dataset.section};b.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();focusTab=true;items[(i+(e.key==='ArrowRight'?1:items.length-1))%items.length].click();}}});
}
function renderHome(){
 $('home').innerHTML=`<div style="padding:34px 0 8px"><h2>지역 선택</h2><p style="color:var(--muted);margin:6px 0 24px">지역을 선택하면 해당 지역의 지표 탭이 열립니다.</p></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px">`+GROUPS.map(g=>{const ids=[...new Set(g.tabs.flatMap(t=>t.ids))],have=ids.filter(id=>DATA.metrics.some(m=>m.id===id)).length;return `<button data-group="${g.key}" style="text-align:left;background:white;border:1px solid var(--line);border-left:4px solid var(--accent);padding:26px 28px;color:var(--ink)"><span style="display:block;font-size:24px;font-weight:700">${g.label}</span><span style="display:block;color:var(--muted);margin-top:6px">${esc(DESC[g.key]||'')}</span><span style="display:block;font-size:13px;color:var(--muted);margin-top:14px">${g.tabs.length}개 탭 · 지표 ${have}/${ids.length}${have<ids.length?' · 일부 수집 준비 중':''}</span></button>`}).join('')+`</div>`;
 document.querySelectorAll('#home [data-group]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.group});
}
function renderCrumb(){
 $('crumb').innerHTML=`<div style="padding:22px 0 0;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><button id="back" style="background:none;border:0;padding:0;color:var(--accent);font-weight:700;font-size:14px">← 전체</button><span style="font-size:22px;font-weight:700">${groupOf(group).label}</span></div>`;
 $('back').onclick=()=>{location.hash='home'};
}
function render(){
 const home=group===null;
 $('home').style.display=home?'':'none';$('crumb').style.display=home?'none':'';$('tabs').style.display=home?'none':'';$('content').style.display=home?'none':'';
 if(home){renderHome();return;}
 renderCrumb();
 document.querySelectorAll('#tabs [data-section]').forEach(b=>{const yes=b.dataset.section===section;b.setAttribute('aria-selected',yes);b.tabIndex=yes?0:-1});
 $('content').setAttribute('aria-labelledby','tab-'+section);
 const tab=tabOf(section),hid=hiddenFor(section);$('section-title').textContent=tab.title;$('section-description').textContent=tab.desc+(hid.length?' · 자료가 오래되어 숨긴 지표: '+hid.map(m=>m.title).join(', '):'');
 const list=listFor(section),valid=list.filter(m=>m.status==='ok').length;
 if(!list.some(m=>m.id===selected))selected=list[0]?.id;
 $('coverage').textContent=list.length?`${list.length}개 지표 · ${valid===list.length?'자료 유효기간 내':(list.length-valid)+'개 확인 필요'}`:'수집 준비 중';$('coverage').className='badge'+(list.length&&valid<list.length?' warn':'');
 $('reading').textContent=reading();
 $('metrics').innerHTML=list.map(m=>`<button class="metric" data-metric="${esc(m.id)}" aria-pressed="${m.id===selected}"><span class="name">${esc(m.title)}</span><span class="value">${fmt(m)}<span class="unit">${esc(m.unit)}</span></span><span class="meta"><span>${esc(dateText(m)||'기준일 없음')}</span><span>${m.status==='ok'?esc(changeText(m)):m.status==='stale'?'오래된 자료':'자료 없음'}</span></span></button>`).join('');
 document.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>{selected=b.dataset.metric;render()});renderPanel();
}
function apply(){
 const [g,s]=location.hash.slice(1).split('/'),prev=group;
 group=GROUPS.some(x=>x.key===g)?g:null;
 if(group){const tabs=groupOf(group).tabs,next=tabs.some(t=>t.key===s)?s:tabs[0].key;if(next!==section||prev!==group)selected=null;section=next;if(prev!==group)buildTabs();}
 render();window.scrollTo(0,0);
 if(focusTab){focusTab=false;const el=group&&$('tab-'+section);if(el)el.focus();}

}
function renderPanel(){const m=DATA.metrics.find(m=>m.id===selected);if(!m){$('panel').innerHTML='<div class="empty">표시할 지표가 없습니다.</div>';return;}const source=m.sources.map(s=>`<div class="source"><div><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.id)} ↗</a><span>${esc(s.origin)}</span></div><div><span>원자료 관측일 ${esc(s.observed||'없음')} · ${esc({daily:'일간',weekly:'주간',monthly:'월간',quarterly:'분기',annual:'연간'}[s.frequency]||s.frequency)}</span><span>수집 ${s.retrieved?esc(new Date(s.retrieved).toLocaleString('ko-KR')):'시각 미확인 · 기존 캐시'}</span><span>관측일 경과 ${s.age??'—'}일 / 유효기간 ${s.maxAge}일${s.fallback?' · 이전 유효 자료 사용':''}</span></div></div>`).join('');
 $('panel').innerHTML=`<div class="panel-top"><div><h3>${esc(m.title)}</h3><div class="latest">${esc(fmt(m))}<small>${esc(m.unit)}</small></div><div class="delta">${esc(m.period)} ${esc(changeText(m))} · 기준 ${esc(dateText(m)||'없음')}</div></div><div class="periods" aria-label="차트 기간">${[0.25,1,3,5,10,0].map(n=>`<button data-years="${n}" aria-pressed="${years===n}" class="${years===n?'active':''}">${n?(n<1?Math.round(n*12)+'개월':n+'년'):'전체'}</button>`).join('')}</div></div><div class="legend"><span><i class="key"></i>${m.secondary?esc(m.secondary.primaryLabel||'전년 대비'):esc(m.title)}</span>${m.secondary?`<span><i class="key alt"></i>${esc(m.secondary.label)}</span>`:''}</div><div class="chart-wrap" id="chart-wrap"><div class="hover" id="hover" aria-live="off">차트 위에서 날짜별 값을 확인하세요.</div><div id="chart"></div><div class="tip" id="tip"></div><div class="chart-range" id="chart-range"></div>${m.status!=='ok'?`<p class="quality">${m.status==='stale'?'최신성을 확인할 수 없어 마지막 관측값을 참고용으로 표시합니다.':'필수 자료가 없어 값을 계산하지 않았습니다.'}</p>`:''}<p class="note">${esc(m.note)}</p><details class="sources"><summary>계산식·출처·자료 상태</summary><div class="formula">${esc(m.formula)}</div>${source}</details>`;
 document.querySelectorAll('[data-years]').forEach(b=>b.onclick=()=>{years=+b.dataset.years;renderPanel()});draw(m);
}
function draw(m){
 const ts=d=>Date.parse(d+'T00:00:00Z');const all=m.points.filter(p=>p[1]!=null);
 if(!all.length){$('chart').innerHTML='<div class="empty">표시할 관측 자료가 없습니다.</div>';$('chart-range').textContent='';return;}
 const end=ts(all[all.length-1][0]),cut=years?end-years*365.25*86400000:-Infinity;
 let primary=m.points.filter(p=>ts(p[0])>=cut&&ts(p[0])<=end);if(primary.filter(p=>p[1]!=null).length<2)primary=all.slice(-2);
 const alternate=(m.secondary?.points||[]).filter(p=>ts(p[0])>=Math.max(cut,ts(primary[0][0]))&&ts(p[0])<=end);
 const vals=[...primary,...alternate].filter(p=>p[1]!=null);let min=Math.min(...vals.map(p=>p[1])),max=Math.max(...vals.map(p=>p[1]));
 const rawMin=min;let pad=(max-min)*.12||Math.max(Math.abs(max)*.03,1);min-=pad;max+=pad;if(rawMin>=0&&min<0)min=0;
 const start=ts(primary[0][0]),span=end-start||86400000,W=850,H=345,L=70,R=20,T=26,B=40;
 const x=d=>L+(ts(d)-start)/span*(W-L-R),y=v=>T+(max-v)/(max-min)*(H-T-B);
 let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.title)} · ${esc(m.unit)} · ${primary[0][0]}부터 ${all[all.length-1][0]}까지"><text x="${L}" y="15" fill="#5e7080" font-size="12">${esc(m.unit)}</text>`;
 for(let i=0;i<5;i++){const v=min+(max-min)*i/4,yy=y(v);svg+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#e2e9ee"/><text x="${L-12}" y="${yy+4}" text-anchor="end" fill="#5e7080" font-size="12">${num(v,Math.abs(v)>100?0:1)}</text>`;}
 if(min<0&&max>0)svg+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="#8ba1b0" stroke-dasharray="4 4"/>`;
 for(let i=0;i<5;i++){const d=new Date(start+span*i/4).toISOString().slice(0,10);svg+=`<text x="${L+(W-L-R)*i/4}" y="${H-12}" text-anchor="${i===0?'start':i===4?'end':'middle'}" fill="#5e7080" font-size="12">${d.slice(0,7)}</text>`;}
 const gaps=all.slice(1).map((p,i)=>(ts(p[0])-ts(all[i][0]))/864e5).sort((a,b)=>a-b),gapLimit=Math.max(5,(gaps[Math.floor(gaps.length/2)]||1)*1.5);
 function path(points,color){let p='',prev=null;for(const [d,v]of points){if(v==null)continue;const t=ts(d);p+=(prev!==null&&(t-prev)/864e5<=gapLimit?'L':'M')+x(d).toFixed(2)+','+y(v).toFixed(2)+' ';prev=t}return `<path d="${p}" stroke="${color}" fill="none" stroke-width="2" vector-effect="non-scaling-stroke"/>`;}
 svg+=path(primary,'#007d83')+path(alternate,'#a36c22');svg+=`<line id="cross" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="#8ba1b0" stroke-dasharray="3 3" visibility="hidden"/><circle id="dot" r="4" fill="#007d83" visibility="hidden"/><rect id="hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/></svg>`;
 $('chart').innerHTML=svg;$('chart-range').textContent=`표시 기간 ${primary[0][0]} — ${all[all.length-1][0]} · 관측일 기준`;
 const good=primary.filter(p=>p[1]!=null),chart=$('chart').querySelector('svg');
 $('hit').onpointermove=e=>{const rect=chart.getBoundingClientRect(),px=(e.clientX-rect.left)/rect.width*W;let point=good.reduce((a,b)=>Math.abs(x(b[0])-px)<Math.abs(x(a[0])-px)?b:a);const cross=$('cross'),dot=$('dot');cross.setAttribute('x1',x(point[0]));cross.setAttribute('x2',x(point[0]));cross.setAttribute('visibility','visible');dot.setAttribute('cx',x(point[0]));dot.setAttribute('cy',y(point[1]));dot.setAttribute('visibility','visible');const other=alternate.find(p=>p[0]===point[0]);$('hover').textContent=`${point[0]} · ${num(point[1])} ${m.unit}`+(other&&other[1]!=null?` · ${m.secondary.label} ${num(other[1])} ${m.unit}`:'');const tip=$('tip'),digits=['천 명','천 건','십억 달러','bp'].includes(m.unit)?1:2;tip.innerHTML=`<b>${esc(point[0])}</b>${num(point[1],digits)} ${esc(m.unit)}`+(other&&other[1]!=null?`<br>${esc(m.secondary.label)} ${num(other[1],digits)} ${esc(m.unit)}`:'');tip.style.display='block';const wr=$('chart-wrap').getBoundingClientRect();let left=e.clientX-wr.left+14;if(left+tip.offsetWidth>wr.width)left=e.clientX-wr.left-tip.offsetWidth-14;tip.style.left=left+'px';tip.style.top=Math.max(0,e.clientY-wr.top-tip.offsetHeight-12)+'px';};
 $('hit').onpointerleave=()=>{$('cross').setAttribute('visibility','hidden');$('dot').setAttribute('visibility','hidden');$('tip').style.display='none';};
}
$('stamp').textContent='최근 수집 '+new Date(DATA.generatedAt).toLocaleString('ko-KR');$('method').textContent=DATA.method;
window.addEventListener('hashchange',apply);apply();
})().catch(error => {
 console.error(error);
 document.getElementById('stamp').textContent = '자료를 불러오지 못했습니다.';
 document.getElementById('panel').textContent = '데이터를 불러올 수 없습니다. 잠시 후 페이지를 새로고침해 주세요.';
});
</script></body></html>
