name: Update data and deploy dashboard

on:
  schedule:
    # Every 6 hours: 02:17, 08:17, 14:17, 20:17 Korea time (UTC+9).
    - cron: '17 5,11,17,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: macro-dashboard-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Used by the Japan e-Stat adapter. The value is never written to the
      # repository or dashboard artifacts.
      ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
      # Provider credentials stay in GitHub Actions secrets and are never
      # written to the repository or public dashboard artifacts.
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
      # Census Economic Indicators key; never emitted into dashboard files.
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test formulas and fallback handling
        run: |
          python -m unittest discover -s tests -p 'test_fetch_data.py' -v
          python -m unittest discover -s tests -p 'test_estat.py' -v
          python -m unittest discover -s tests -p 'test_oecd_cli.py' -v
      - name: Refresh observations
        id: refresh
        continue-on-error: true
        timeout-minutes: 12
        run: python -u fetch_data.py
      - name: Validate deployable JSON
        run: python -m unittest discover -s tests -p test_artifact.py -v
      - name: Commit data and durable fallback cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json cache/observations.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update macro observations'
            git push origin HEAD:main
          fi
      - name: Stage public files only
        run: |
          mkdir -p _site
          cp index.html dcf.html data.json favicon.svg favicon.ico favicon-32.png favicon-48.png favicon-192.png apple-touch-icon.png _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report any fetch outage after publishing fallback
        if: steps.refresh.outcome == 'failure'
        run: |
          echo '::error::Refresh failed. Preserved data was deployed; inspect source errors above.'
          exit 1

